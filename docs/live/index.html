<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand Tie Clips 4.0 · Live Editor Demo</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="extensions/htc/h3_ref_chain.css">
<link rel="stylesheet" href="extensions/htc/r2/r2.css">
<style>
:root{color-scheme:dark}
body{margin:0;background:#141517;color:#e8e8e8;font:14px/1.5 system-ui,sans-serif}
header{padding:14px 18px;border-bottom:1px solid #2a2c31;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;letter-spacing:.04em} header a{color:#74c0fc}
header .tabs a{margin-right:12px} header .note{color:#9aa0a6;font-size:12px;flex-basis:100%}
#stage{position:relative;margin:12px;min-height:820px;border:1px solid #2a2c31;border-radius:8px;overflow:hidden;background:#0d0e10}
#stage > *{position:relative !important;left:0 !important;top:0 !important;width:100% !important;transform:none !important}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#25262b;border:1px solid #444;padding:9px 16px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
</style></head><body>
<header><h1>H3 REF2VA CHAIN · Control Room</h1>
<span class="tabs"><a href="./">Hand Tie Clips</a><a href="sandtie.html">SandTie PromptRig</a>
<a href="https://github.com/sandpies/ComfyUI-Hand-Tie-Clips">GitHub</a></span>
<span class="note">This is the node's real 4.0 editor code running in your browser with sample data. Click through the tabs; anything that would render or call your local writer says so instead.</span></header>
<div id="stage">loading the editor…</div><div id="toast"></div>
<script type="module">

const ready = async () => {
  if (!("serviceWorker" in navigator)) { document.body.textContent = "This demo needs a browser with service workers."; return false; }
  await navigator.serviceWorker.register("./sw.js");
  if (!navigator.serviceWorker.controller) {
    await new Promise((r) => navigator.serviceWorker.addEventListener("controllerchange", r, { once: true }));
  }
  return true;
};
const toastEl = document.getElementById("toast");
window.__demoToast = (t) => { if (!t) return; toastEl.textContent = t; toastEl.classList.add("on");
  clearTimeout(window.__tt); window.__tt = setTimeout(() => toastEl.classList.remove("on"), 3200); };
function makeNode(type, title, widgets, size) {
  const domWidgets = [];
  const node = {
    id: type === "HandTieClips" ? 1 : 2, type, title, size: size.slice(), properties: {}, inputs: [], outputs: [],
    widgets: widgets.map((w) => ({ ...w, options: { ...(w.options || {}) }, callback: undefined })),
    graph: window.__appStub ? null : null,
    addDOMWidget(name, kind, el, opts) { domWidgets.push(el); return { name, type: kind, element: el, options: opts || {}, value: "" }; },
    addWidget(kind, name, value, cb, opts) { const w = { type: kind, name, value, callback: cb, options: opts || {} }; this.widgets.push(w); return w; },
    setSize(sz) { this.size = [sz[0], sz[1]]; }, computeSize() { return this.size; },
    setDirtyCanvas() {}, remove() {}, getInputNode() { return null; }, onResize() {},
    domWidgets,
  };
  return node;
}

if (await ready()) {
  const nodes = await (await fetch("data/nodes.json")).json();
  await import("./extensions/htc/h3_ref_chain_ui.js");
  const ext = window.__appStub.extensions.find((e) => typeof e.beforeRegisterNodeDef === "function");
  const node = makeNode("HandTieClips", "H3 Ref2VA Chain", nodes.htc, [1600, 900]);
  const T = { prototype: {} };
  await ext.beforeRegisterNodeDef(T, { name: "HandTieClips" });
  T.prototype.onNodeCreated.call(node);
  const stage = document.getElementById("stage"); stage.textContent = "";
  node.domWidgets.forEach((el) => stage.append(el));
}
</script></body></html>
